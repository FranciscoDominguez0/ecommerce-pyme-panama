# Nginx Proxy Manager (NPM) runs on the VPS host and only reverse-proxies
# traffic, it cannot serve PHP. So the Laravel app runs inside Docker with its
# own nginx + php-fpm and listens on port 80 (published as 127.0.0.1:8080).
#
# Deploy on the VPS (inside this project directory):
#   cp .env.docker.example .env.docker   # set APP_URL + change DB password
#   docker compose up -d --build
#
# Then in NPM create a Proxy Host:
#   Domain: your-domain.com
#   Forward hostname: 127.0.0.1
#   Forward port: 8080
#   (enable Force SSL / request a Let's Encrypt cert there)

name: ecommerce-pyme-panama

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-pyme-panama:latest
    container_name: ecommerce-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - appnet

  queue:
    image: ecommerce-pyme-panama:latest
    container_name: ecommerce-queue
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - DB_HOST=db
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - appnet

  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce_pyme_panama
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_password
    ports:
      # Only reachable through an SSH tunnel, never exposed publicly.
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

volumes:
  app_storage:
  dbdata:

networks:
  appnet:
    driver: bridge
