[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Gestión de procesos dinámica optimizada para alta concurrencia
pm = dynamic
pm.max_children = 35
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 1000

; Cola de espera en socket para absorber ráfagas sin rechazar conexiones
listen.backlog = 1024

; Limpieza de entorno y logs
clear_env = no
access.log = /dev/null
catch_workers_output = yes

; Endpoints de salud y estado
pm.status_path = /status
ping.path = /ping
ping.response = pong
