server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 20M;

    # Extraer la IP real del cliente que nos pasa NPM u otro reverse proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Enviar los logs de Nginx a Docker
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Las cabeceras de seguridad se centralizan en el Middleware de Laravel (SecurityHeaders.php)
    # para evitar respuestas duplicadas (SAMEORIGIN,SAMEORIGIN / nosniff,nosniff)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;

        # Le dice a PHP que la conexión es HTTPS (viene de NPM via X-Forwarded-Proto)
        fastcgi_param HTTPS "on";
        fastcgi_param HTTP_X_FORWARDED_PROTO "https";

        fastcgi_hide_header X-Powered-By;
    }

    # Bloquear y devolver 404 (no 403) para archivos ocultos y sensibles (.env, .git, *.log, composer.*)
    location ~ /\.(?!well-known).* {
        return 404;
    }

    location ~* /(composer\.(json|lock)|package\.json|phpunit\.xml|.*\.log)$ {
        return 404;
    }
}
