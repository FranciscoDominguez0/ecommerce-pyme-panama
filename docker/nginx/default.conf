server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    client_max_body_size 20M;

    # Compresión gzip para reducir tamaño de payload y latencia
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2;

    # Extraer la IP real del cliente que nos pasa NPM u otro reverse proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Enviar los logs de Nginx a Docker
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Caché inmutable para assets compilados por Vite con fingerprint
    location ~* ^/build/assets/.*\.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fuentes locales y archivos de audio (inmutables / largo plazo)
    location ~* \.(?:woff|woff2|ttf|eot|otf|mp3|wav|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Caché para almacenamiento de medios y subidas (fotos de productos)
    location ~* ^/(?:storage|uploads)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Caché para imágenes estáticas, CSS y JS sin fingerprint
    location ~* \.(?:ico|jpg|jpeg|png|gif|webp|svg|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;

        # Buffers en memoria para evitar escrituras en disco bajo alta concurrencia
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 60s;

        # Le dice a PHP que la conexión es HTTPS (viene de NPM via X-Forwarded-Proto)
        fastcgi_param HTTPS "on";
        fastcgi_param HTTP_X_FORWARDED_PROTO "https";

        fastcgi_hide_header X-Powered-By;
    }

    # Bloquear y devolver 404 (no 403) para archivos ocultos y sensibles (.env, .git, *.log, composer.*)
    location ~ /\.(?!well-known).* {
        return 404;
    }

    location ~* /(composer\.(json|lock)|package\.json|phpunit\.xml|.*\.log)$ {
        return 404;
    }
}
