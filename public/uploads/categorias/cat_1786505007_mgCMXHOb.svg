<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- Cuerpo de la fuente de poder -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="#23C773" stroke-width="3"/>

  <!-- Ventilador (círculo con aspas) -->
  <circle cx="24" cy="24" r="9" fill="none" stroke="#23C773" stroke-width="2.5"/>
  <path d="M24 24 L24 17 M24 24 L29.5 20 M24 24 L29.5 28 M24 24 L24 31 M24 24 L18.5 28 M24 24 L18.5 20"
        stroke="#23C773" stroke-width="2" stroke-linecap="round"/>

  <!-- Interruptor 0/1 -->
  <rect x="38" y="16" width="10" height="10" rx="1.5" fill="none" stroke="#23C773" stroke-width="2"/>
  <line x1="41" y1="18.5" x2="41" y2="23.5" stroke="#23C773" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="45.5" cy="21" r="2.3" fill="none" stroke="#23C773" stroke-width="1.6"/>

  <!-- Conector de cable de poder (IEC) -->
  <rect x="36" y="38" width="14" height="12" rx="1.5" fill="none" stroke="#23C773" stroke-width="2.5"/>
  <line x1="40" y1="41.5" x2="40" y2="46.5" stroke="#23C773" stroke-width="2" stroke-linecap="round"/>
  <line x1="46" y1="41.5" x2="46" y2="46.5" stroke="#23C773" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="44" x2="43" y2="47.5" stroke="#23C773" stroke-width="2" stroke-linecap="round"/>

  <!-- Rejilla de ventilación lateral -->
  <line x1="14" y1="44" x2="26" y2="44" stroke="#23C773" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="48" x2="26" y2="48" stroke="#23C773" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="52" x2="22" y2="52" stroke="#23C773" stroke-width="2" stroke-linecap="round"/>
</svg>
