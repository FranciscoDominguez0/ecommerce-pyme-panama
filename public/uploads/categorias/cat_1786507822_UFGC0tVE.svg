<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- Silueta exterior de la funda (mas ancha/redondeada que un telefono) -->
  <rect x="12" y="4" width="40" height="56" rx="10" fill="none" stroke="#23C773" stroke-width="3.2"/>

  <!-- Pantalla / contorno interior del dispositivo -->
  <rect x="18" y="12" width="28" height="40" rx="3" fill="none" stroke="#23C773" stroke-width="2.4"/>

  <!-- Camara trasera (esquina) -->
  <circle cx="24" cy="18" r="3" fill="none" stroke="#23C773" stroke-width="2"/>

  <!-- Boton lateral -->
  <line x1="52" y1="22" x2="52" y2="30" stroke="#23C773" stroke-width="3" stroke-linecap="round"/>

  <!-- Puerto inferior -->
  <line x1="28" y1="56" x2="36" y2="56" stroke="#23C773" stroke-width="2.4" stroke-linecap="round"/>
</svg>
